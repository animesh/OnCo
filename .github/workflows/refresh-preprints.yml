name: Refresh preprint tracker from Europe PMC

on:
  schedule:
    - cron: "17 6 * * 3" # Wednesdays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-preprints.ts
      - run: npm run validate
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-preprints
          title: "Weekly refresh: Europe PMC preprint tracker"
          commit-message: "chore: refresh preprint tracker from Europe PMC"
          body: |
            Automated weekly pull of bioRxiv, medRxiv and other preprints from the last 90 days for every target, product and technology, from the Europe PMC REST API, with the journal versions that have since appeared (HAS_PREPRINT links).
            Files under `public/preprints/` changed. The /preprints/ page is rebuilt from `public/preprints/index.json`.
          labels: automated, pipeline
          delete-branch: true
      - name: Merge the refresh (this run already validated and tested it)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
