name: Refresh FDA oncology approvals feed

on:
  schedule:
    - cron: "7 6 * * 3" # Wednesdays 06:07 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/fetch-fda.ts
      - run: npm run validate
      - uses: peter-evans/create-pull-request@v7
        id: cpr
        with:
          branch: bot/refresh-fda
          title: "Weekly refresh: FDA oncology approvals feed"
          commit-message: "chore: refresh FDA approvals feed (OCE notifications, openFDA drugsfda)"
          body: |
            Automated weekly pull of the FDA Oncology Center of Excellence approval notifications and openFDA `drugsfda` submissions for corpus products, into `public/fda/recent.json`.
            `/regulatory/` shows items new since the last snapshot and notices that match no product ("not yet in corpus"). Add missing regulatory events to the product records and open new-object issues for the rest.
          labels: automated, pipeline
          delete-branch: true
      - name: Merge the refresh (this run already validated and tested it)
        if: steps.cpr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --squash --delete-branch "${{ steps.cpr.outputs.pull-request-number }}" || echo "merge deferred, the pull request stays open for a human"
